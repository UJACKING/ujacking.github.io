site_name: UJACKING
site_description: Aprende ciberseguridad desde cero, gratis y sin perderte.
site_url: https://ujacking.github.io/
repo_url: https://github.com/UJACKING/ujacking.github.io
repo_name: UJACKING/ujacking.github.io
edit_uri: edit/main/docs/
docs_dir: docs
use_directory_urls: true

